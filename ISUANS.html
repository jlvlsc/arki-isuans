<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arki-ISUans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #181818; /* Dark theme background color */
            color: #e0e0e0; /* Light text color for dark theme */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        /* Custom styling to fine-tune the look */
        .login-container {
            max-width: 350px; /* Instagram login form width */
            width: 100%;
        }
        .login-box {
            border: 1px solid #363636; /* Darker border color */
            background-color: #262626; /* Darker background color */
            color: #e0e0e0; /* Light text color */
        }
        input[type="text"],
        input[type="password"] {
            background-color: #363636; /* Dark input background */
            border: 1px solid #505050; /* Dark input border */
            color: #e0e0e0; /* Light input text */
            padding: 10px;
            font-size: 14px;
        }
        button {
            background-color: #0095f6; /* Instagram button color (can adjust for dark theme if needed) */
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
            opacity: 0.7; /* Default opacity */
            transition: opacity 0.3s ease;
            border: none; /* Remove default button border */
        }
        button:hover:not(:disabled) {
            opacity: 1; /* Full opacity on hover */
        }
        button:disabled {
            opacity: 0.3; /* Disabled state opacity */
            cursor: not-allowed;
        }
        .signup-box {
             border: 1px solid #363636; /* Darker border color */
             background-color: #262626; /* Darker background color */
             color: #e0e0e0; /* Light text color */
        }
         /* Style for the logo image */
        .site-logo {
            height: 40px; /* Adjust size as needed */
            margin-right: 10px; /* Space between logo and text */
        }

        /* Typing Animation Styles */
        .typing-container {
            display: inline-block; /* Allows text and cursor to be inline */
            overflow: hidden; /* Hides the text until typed */
            white-space: nowrap; /* Prevents text from wrapping */
            border-right: .15em solid limegreen; /* Green blinking cursor */
            /* Animation will be controlled by JavaScript for looping */
        }

        /* The typing effect */
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        /* The blinking cursor effect */
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: limegreen; } /* Green blinking cursor */
        }

        /* Class to apply the typing animation */
        .animate-typing {
             animation:
                typing 3.5s steps(40, end),
                blink-caret .75s step-end infinite;
        }

        /* CSS for the glowing effect */
        .glow-button {
            box-shadow: 0 0 8px 2px rgba(0, 255, 0, 0.5); /* Green glow effect */
            animation: pulse-glow 1.5s infinite alternate; /* Optional pulsing animation */
        }

        /* Keyframes for the pulsing glow animation */
        @keyframes pulse-glow {
            from {
                box-shadow: 0 0 8px 2px rgba(0, 255, 0, 0.5);
            }
            to {
                box-shadow: 0 0 12px 4px rgba(0, 255, 0, 0.8);
            }
        }

        /* Dark theme specific text colors */
        .text-gray-500 {
            color: #a0a0a0; /* Lighter gray for dark theme */
        }
         .text-blue-800 {
            color: #60a5fa; /* Lighter blue for links in dark theme */
        }
    </style>
</head>
<body>

    <div class="login-container flex flex-col items-center">
        <div class="login-box p-10 mb-3 rounded-sm w-full">
            <div class="flex justify-center items-center mb-8">
                <img src="https://png.pngtree.com/png-vector/20220702/ourmid/pngtree-abstract-roof-architecture-logo-illustration-design-png-image_5673244.png" alt="Architecture Logo" class="site-logo">
                <h1 class="text-3xl font-semibold italic">
                    <span id="isuans-text" class="typing-container">Arki-ISUans</span>
                </h1>
            </div>

            <form class="flex flex-col gap-2">
                <input type="text" placeholder="ID number, username or email" class="rounded-sm focus:outline-none focus:border-gray-400">
                <input type="password" placeholder="Password" class="rounded-sm focus:outline-none focus:border-gray-400">

                <button type="submit" class="mt-4 rounded-md" disabled>Log In</button>
            </form>

            <div class="flex items-center justify-between mt-6">
                <div class="h-px bg-gray-300 flex-grow" style="background-color: #505050;"></div> <span class="px-4 text-gray-500 text-sm font-semibold">OR</span>
                <div class="h-px bg-gray-300 flex-grow" style="background-color: #505050;"></div> </div>

            <div class="mt-6 text-center">
                <a href="#" class="text-blue-800 text-sm font-semibold">Login with UAPSA card</a>
            </div>

            <div class="mt-4 text-center">
                <a href="#" class="text-blue-800 text-xs">Forgot password?</a>
            </div>
        </div>

        <div class="signup-box py-5 rounded-sm w-full text-center text-sm">
            Don't have an account? <a href="#" class="text-blue-800 font-semibold">Sign up</a>
        </div>

        </div>

    <script>
        // Basic JavaScript to enable the button and add glow when inputs are filled
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('input');
        const loginButton = form.querySelector('button');

        const checkInputs = () => {
            let allFilled = true;
            inputs.forEach(input => {
                if (input.value.trim() === '') {
                    allFilled = false;
                }
            });

            loginButton.disabled = !allFilled;
            loginButton.style.opacity = allFilled ? '1' : '0.7';

            // Add or remove the glow class based on input status
            if (allFilled) {
                loginButton.classList.add('glow-button');
            } else {
                loginButton.classList.remove('glow-button');
            }
        };

        inputs.forEach(input => {
            input.addEventListener('input', checkInputs);
        });

        // Initial check
        checkInputs();

        // JavaScript for looping the typing animation
        const isuansTextSpan = document.getElementById('isuans-text');

        // Function to restart the animation
        const restartAnimation = () => {
            // Remove the animation class
            isuansTextSpan.classList.remove('animate-typing');
            // Force a reflow (repaint) to restart the animation
            void isuansTextSpan.offsetWidth;
            // Add the animation class back
            isuansTextSpan.classList.add('animate-typing');
        };

        // Add the animation class initially
        isuansTextSpan.classList.add('animate-typing');

        // Listen for the end of the animation
        isuansTextSpan.addEventListener('animationend', () => {
            // Wait for 3 seconds before restarting the animation
            setTimeout(restartAnimation, 3000); // 3000 milliseconds = 3 seconds
        });

    </script>

</body>
</html>
